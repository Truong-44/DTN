<form (ngSubmit)="addCategory()" #f="ngForm" style="margin-bottom: 16px">
  <input
    type="text"
    name="tendanhmuc"
    [(ngModel)]="tendanhmuc"
    placeholder="Tên danh mục"
    required
  />
  <input type="text" name="mota" [(ngModel)]="mota" placeholder="Mô tả" />
  <button type="submit">Thêm mới</button>
  <button type="button" (click)="cancel.emit()">Hủy</button>
</form>
