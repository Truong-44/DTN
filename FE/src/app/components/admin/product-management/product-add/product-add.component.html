<form (ngSubmit)="addProduct()" #f="ngForm" class="product-add-form">
  <h3>Thêm sản phẩm mới</h3>
  <div class="detail-section">
    <!-- Hình chính -->
    <div class="main-image">
      <b>Chọn ảnh chính</b>
      <!-- Select động các cấp thư mục -->
      <ng-container *ngFor="let folders of subFolders; let i = index">
        <label>
          <select
            [ngModel]="mainPath[i]"
            (ngModelChange)="onMainFolderChange(i, $event)"
            name="mainFolder{{ i }}"
          >
            <option value="">--Chọn--</option>
            <option *ngFor="let f of folders" [value]="f">{{ f }}</option>
          </select>
        </label>
      </ng-container>
      <!-- Chọn file -->
      <input
        type="file"
        accept="image/*"
        (change)="onMainFileSelected($event)"
      />
      <div class="img-preview" *ngIf="mainImagePreview">
        <img [src]="mainImagePreview" alt="Preview" />
        <span>{{ selectedMainFileName }}</span>
      </div>
      <div
        style="margin-top: 8px; color: #1976d2"
        *ngIf="selectedMainFileName && mainPath.length"
      >
        Đường dẫn sẽ lưu:
        <b>{{ mainPath.join("/") }}/{{ selectedMainFileName }}</b>
      </div>
    </div>

    <!-- Hình phụ -->
    <div class="sub-images">
      <b>Chọn nhiều hình phụ</b>
      <!-- Select động các cấp thư mục cho hình phụ -->
      <ng-container *ngFor="let folders of subFoldersForSub; let i = index">
        <label>
          <select
            [ngModel]="subPath[i]"
            (ngModelChange)="onSubFolderChange(i, $event)"
            name="subFolder{{ i }}"
          >
            <option value="">--Chọn--</option>
            <option *ngFor="let f of folders" [value]="f">{{ f }}</option>
          </select>
        </label>
      </ng-container>
      <!-- Chọn nhiều file -->
      <input
        type="file"
        accept="image/*"
        multiple
        (change)="onSubFilesSelected($event)"
      />
      <div class="img-preview" *ngIf="subImagePreviews.length">
        <div
          *ngFor="let url of subImagePreviews; let i = index"
          style="display: inline-block; margin-right: 8px"
        >
          <img [src]="url" alt="Preview" width="60" />
          <div style="font-size: 12px">{{ selectedSubFileNames[i] }}</div>
        </div>
      </div>
      <div style="margin-top: 8px; color: #388e3c" *ngIf="hinhphu.length">
        <div *ngFor="let img of hinhphu">
          {{ img }}
        </div>
      </div>
      <div
        style="margin-top: 8px; color: #1976d2"
        *ngIf="selectedSubFileNames.length && subPath.length"
      >
        <div *ngFor="let name of selectedSubFileNames">
          Đường dẫn sẽ lưu: <b>{{ subPath.join("/") }}/{{ name }}</b>
        </div>
      </div>
    </div>

    <!-- Thông tin cơ bản và chi tiết (giữ nguyên như cũ) -->
    <div class="basic-fields">
      <label>
        Tên sản phẩm
        <input
          type="text"
          name="tensanpham"
          [(ngModel)]="tensanpham"
          required
        />
      </label>
      <label>
        Giá cũ
        <input type="number" name="giacu" [(ngModel)]="giacu" min="0" />
      </label>
      <label>
        Giá mới
        <input type="number" name="giamoi" [(ngModel)]="giamoi" min="0" />
      </label>
      <label>
        Danh mục
        <select name="danhmucId" [(ngModel)]="danhmucId" required>
          <option [ngValue]="null" disabled>Chọn danh mục</option>
          <option *ngFor="let cat of categories" [ngValue]="cat.id">
            {{ cat.tendanhmuc }}
          </option>
        </select>
      </label>
      <label>
        Mô tả
        <textarea name="mota" [(ngModel)]="mota" rows="3"></textarea>
      </label>
    </div>
    <div class="detail-fields">
      <label>
        Màu
        <input type="text" [(ngModel)]="tenmau" name="tenmau" />
      </label>
      <label>
        Mã màu
        <input type="text" [(ngModel)]="mamau" name="mamau" />
      </label>
      <label>
        Chất liệu
        <input type="text" [(ngModel)]="chatlieu" name="chatlieu" />
      </label>
      <label>
        Kích thước
        <input type="text" [(ngModel)]="kichthuoc" name="kichthuoc" />
      </label>
      <label>
        Trọng lượng (kg)
        <input
          type="number"
          [(ngModel)]="trongluong"
          name="trongluong"
          min="0"
        />
      </label>
      <label>
        Số lượng
        <input type="number" [(ngModel)]="soluong" name="soluong" min="0" />
      </label>
    </div>
  </div>
  <div class="actions">
    <button type="submit" [disabled]="loading">Thêm</button>
    <button type="button" (click)="resetForm()" [disabled]="loading">
      Làm mới
    </button>
  </div>
</form>
