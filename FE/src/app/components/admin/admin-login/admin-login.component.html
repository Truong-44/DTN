<div class="admin-login-container">
  <form class="admin-login-form" (ngSubmit)="onLogin()" #f="ngForm">
    <h2>Đăng nhập Quản trị</h2>
    <div class="form-group">
      <label for="username">Tên đăng nhập</label>
      <input
        id="username"
        type="text"
        [(ngModel)]="username"
        name="username"
        required
        placeholder="Nhập tên đăng nhập"
      />
    </div>
    <div class="form-group">
      <label for="password">Mật khẩu</label>
      <input
        id="password"
        type="password"
        [(ngModel)]="password"
        name="password"
        required
        placeholder="Nhập mật khẩu"
      />
    </div>
    <div *ngIf="error" class="error">{{ error }}</div>
    <button type="submit" [disabled]="!f.valid">Đăng nhập</button>
    
    <div class="login-options">
      <button type="button" (click)="goToMainLogin()" class="btn-secondary">
        🔙 Đăng nhập thường
      </button>
      <button type="button" (click)="goToDebug()" class="btn-debug">
        🔍 Debug Admin
      </button>
    </div>
  </form>
</div>
