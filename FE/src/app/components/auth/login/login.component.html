<div class="auth-container">
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Đăng nhập</h2>
        <p>Chào mừng bạn quay trở lại!</p>
      </div>

      <form (ngSubmit)="login()" #loginForm="ngForm" class="auth-form">
        <div class="form-group">
          <label for="email">Email hoặc tên đăng nhập</label>
          <input
            id="email"
            name="email"
            [(ngModel)]="email"
            required
            type="text"
            placeholder="Nhập email hoặc tên đăng nhập"
            [class.error]="loginForm.submitted && !email"
          />
          <div *ngIf="loginForm.submitted && !email" class="field-error">
            Vui lòng nhập email hoặc tên đăng nhập
          </div>
        </div>

        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <div class="password-wrapper">
            <input
              id="password"
              name="password"
              [(ngModel)]="password"
              required
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Nhập mật khẩu"
              [class.error]="loginForm.submitted && !password"
            />
            <button
              type="button"
              class="password-toggle"
              (click)="togglePassword()"
              [attr.aria-label]="showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
            >
              <i
                class="fas"
                [class.fa-eye]="!showPassword"
                [class.fa-eye-slash]="showPassword"
              ></i>
            </button>
          </div>
          <div *ngIf="loginForm.submitted && !password" class="field-error">
            Vui lòng nhập mật khẩu
          </div>
        </div>

        <div class="form-options">
          <label class="checkbox-wrapper">
            <input type="checkbox" [(ngModel)]="rememberMe" name="rememberMe" />
            <span class="checkmark"></span>
            Ghi nhớ đăng nhập
          </label>
          <a href="#" class="forgot-link">Quên mật khẩu?</a>
        </div>

        <button
          type="submit"
          class="login-btn"
          [disabled]="loading"
          [class.loading]="loading"
        >
          <span *ngIf="!loading">Đăng nhập</span>
          <span *ngIf="loading" class="loading-spinner">
            <i class="fas fa-spinner fa-spin"></i>
            Đang đăng nhập...
          </span>
        </button>

        <div *ngIf="errorMessage" class="error-message">
          <i class="fas fa-exclamation-circle"></i>
          {{ errorMessage }}
        </div>
      </form>

      <div class="auth-footer">
        <p>
          Chưa có tài khoản?
          <a routerLink="/register" class="register-link">Đăng ký ngay</a>
        </p>
      </div>

      <div class="divider">
        <span>Hoặc đăng nhập với</span>
      </div>

      <div class="social-login">
        <button
          type="button"
          class="social-btn google"
          (click)="loginWithGoogle()"
        >
          <i class="fab fa-google"></i>
          Google
        </button>
        <button
          type="button"
          class="social-btn facebook"
          (click)="loginWithFacebook()"
        >
          <i class="fab fa-facebook-f"></i>
          Facebook
        </button>
      </div>
    </div>
  </div>
</div>
