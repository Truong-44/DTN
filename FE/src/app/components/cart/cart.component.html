<section class="cart-section">
  <div class="cart-container" *ngIf="!isLoading">
    <h2>Giỏ hàng của bạn</h2>
    <div *ngIf="cartItems.length === 0" class="empty-cart">
      <p>Giỏ hàng trống.</p>
      <button class="continue-btn" (click)="continueShopping()">
        Tiếp tục mua sắm
      </button>
    </div>
    <div *ngIf="cartItems.length > 0">
      <table class="cart-table">
        <thead>
          <tr>
            <th>Ảnh</th>
            <th>Tên sản phẩm</th>
            <th>Màu sắc</th>
            <th>Đơn giá</th>
            <th>Số lượng</th>
            <th>Thành tiền</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of cartItems; trackBy: trackByItem">
            <td>
              <img
                [src]="getProductImage(item)"
                alt="Ảnh sản phẩm"
                class="cart-img"
              />
            </td>
            <td>{{ item.tensanpham }}</td>
            <td>{{ item.tenmau }}</td>
            <td>{{ item.dongia | number }}đ</td>
            <td>
              <div class="qty-control">
                <button (click)="decreaseQuantity(item)">-</button>
                <span>{{ item.soluong }}</span>
                <button (click)="increaseQuantity(item)">+</button>
              </div>
            </td>
            <td>{{ item.dongia * item.soluong | number }}đ</td>
            <td>
              <button class="remove-btn" (click)="removeItem(item)">Xóa</button>
            </td>
          </tr>
        </tbody>
      </table>
      <div class="cart-actions">
        <div class="cart-total">
          <b>Tổng tiền:</b> <span>{{ totalPrice | number }}đ</span>
        </div>
        <button class="checkout-btn" (click)="proceedToCheckout()">
          Thanh toán
        </button>
        <button class="clear-btn" (click)="clearCart()">Xóa giỏ hàng</button>
      </div>
    </div>
  </div>
</section>
